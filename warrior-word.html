<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Warrior Word</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:ital,wght@0,700;0,800;1,400&family=UnifrakturMaguntia&display=swap">
<style>
:root{--b:#233f9e;--b2:#2d4fc4;--lb:#e3e8f5;--bg:#f0f3ff;--t:#12203a;--c:#fff;--m:#6b7280;--o:#e8a22d;--g:#f3c13a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--t);font:16px/1.55 'DM Sans',system-ui,sans-serif}
button,input,select,textarea{font:inherit}
.top{background:#233f9e;color:#dbe4ff;display:flex;justify-content:space-between;align-items:center;padding:8px 24px;gap:8px;flex-wrap:wrap;font-size:13px;letter-spacing:.6px}
.top .r{display:flex;gap:12px}
.top button{background:transparent;border:1px solid rgba(255,255,255,.55);color:#fff;border-radius:6px;padding:6px 13px;font-weight:700;cursor:pointer;font-size:13px;letter-spacing:.5px}
.top button.g{color:var(--g);border-color:#6f86d8}.top button:hover{background:rgba(255,255,255,.12)}
.mast{background:#fff;color:#233f9e;text-align:center;padding:18px 24px 0}
.mast .k{font-weight:700;letter-spacing:3px;font-size:12px;text-transform:uppercase}
.mast h1{font:clamp(40px,8vw,62px)/1.05 'UnifrakturMaguntia',serif;margin:2px 0;cursor:pointer;font-weight:400}
.mast .st{color:#e8a22d;letter-spacing:13px;font-size:17px;padding-left:13px}
.mast .tg{font:italic 400 15px 'Playfair Display',serif;color:#5468c0;margin:4px 0 12px}
.mast .bar{display:flex;justify-content:space-between;border-top:2px solid #233f9e;border-bottom:2px solid #233f9e;padding:4px 0;color:var(--m);font-size:12px;gap:8px;flex-wrap:wrap;margin-bottom:16px}
nav{background:#233f9e;display:flex;justify-content:center;flex-wrap:wrap}
nav button{border:0;border-right:1px solid rgba(255,255,255,.2);background:transparent;color:#fff;padding:14px 14px 11px;font-weight:700;font-size:12.5px;letter-spacing:1.3px;text-transform:uppercase;cursor:pointer;border-bottom:3px solid transparent}
nav button:last-child{border-right:0}
nav button:hover{background:rgba(255,255,255,.1)}nav button.on{border-bottom-color:var(--cc,#6aa0ff)}
main{max-width:960px;margin:0 auto;padding:24px 20px 60px}
h2{font:700 12px 'DM Sans';letter-spacing:2.5px;text-transform:uppercase;color:var(--m);border-top:3px solid var(--cc,#233f9e);border-bottom:1px solid #dfe3ef;padding:10px 0;margin:0 0 20px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.card{background:var(--c);border-radius:14px;border:1px solid #e3e6f1;overflow:hidden;cursor:pointer;transition:.15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-3px);box-shadow:0 8px 22px rgba(35,63,158,.13)}
.card img{width:100%;height:150px;object-fit:cover}
.card .x{padding:20px 20px 16px}
.card h3{margin:8px 0 6px;font:700 19px/1.25 'Playfair Display',serif;color:#111827}
.tag{display:inline-block;background:color-mix(in srgb,var(--cc,#233f9e) 14%,white);color:var(--cc,#233f9e);font:700 12px 'DM Sans';padding:4px 11px;border-radius:5px;letter-spacing:1.5px;text-transform:uppercase}
.meta{color:#8a90a0;font-size:12px}
.card p{margin:0 0 8px;color:var(--m);font-size:14px;line-height:1.6}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px;margin-bottom:34px}
.cat{background:var(--cc);color:#fff;border:0;border-radius:14px;padding:22px 12px;font:800 20px 'Playfair Display',serif;cursor:pointer}
.cat small{display:block;font:500 12px 'DM Sans';opacity:.9;margin-top:4px}
.art{background:var(--c);border-radius:18px;padding:36px;max-width:820px;margin:auto;border:1px solid #e3e6f1}
.art h1{font:800 40px/1.15 'Playfair Display',serif;margin:12px 0}.art img.hero{width:100%;border-radius:12px;margin:14px 0}
.art .body{white-space:pre-wrap;font-size:19px}
.art .meta,.art .tag{font-size:15px}.art .tag{font-size:14px;padding:6px 14px}
.btn{border:0;background:var(--b);color:#fff;padding:10px 18px;border-radius:9px;font-weight:700;font-size:14px;cursor:pointer}
.btn.o{background:var(--o);color:#222}.btn.r{background:#c93a4a}.btn.g{background:transparent;color:var(--b);border:2px solid var(--b)}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}
form.f,.box{background:var(--c);border-radius:18px;padding:26px;max-width:640px;margin:auto;border:1px solid #e3e6f1}
label{display:block;font-weight:700;font-size:13px;margin:12px 0 4px;color:var(--b2)}
input[type=text],input[type=email],input[type=password],select,textarea{width:100%;padding:11px;border:2px solid var(--lb);border-radius:10px;background:var(--bg);color:var(--t)}
textarea{min-height:220px}
.staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:20px}
.person{background:var(--c);border-radius:18px;padding:26px;text-align:center;border:1px solid #e3e6f1;border-top:5px solid var(--cc)}
.av{width:96px;height:96px;border-radius:50%;margin:0 auto 10px;background:var(--cc);color:#fff;display:grid;place-items:center;font:800 32px 'Playfair Display',serif;object-fit:cover}
.person h3{font:700 22px 'Playfair Display',serif;margin:4px 0 8px}
.person .tag{font-size:13px;padding:5px 12px}.person p{font-size:15px;color:var(--m)}
.mod{position:fixed;inset:0;background:rgba(10,20,50,.5);display:grid;place-items:center;z-index:50;padding:16px}
.mod .box{width:100%;max-width:420px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--c);padding:10px 14px;border-radius:12px;margin:8px 0;flex-wrap:wrap;border:1px solid #e3e6f1;border-left:6px solid var(--cc,#233f9e)}
.item .meta{font-size:14px}
.note{background:#fff8e0;color:#5a4300;padding:10px 14px;border-radius:10px;font-size:14px;margin:10px 0}
footer{background:#233f9e;color:#dbe4ff;text-align:center;padding:18px 16px;font-size:13px}
footer b{color:var(--g)}
@media(max-width:700px){nav button{padding:11px 9px;font-size:11px}.top{padding:7px 12px}.art{padding:22px 18px}}
</style></head><body>
<div id="app"></div>
<script type="application/json" id="data">{"cats": [{"id": "news", "name": "News", "col": "#233f9e"}, {"id": "sports", "name": "Sports", "col": "#d62839"}, {"id": "life", "name": "Student Life", "col": "#e0568f"}, {"id": "jokes", "name": "Joke Page", "col": "#e8872d"}, {"id": "recipes", "name": "Recipes", "col": "#8a5a2b"}, {"id": "reviews", "name": "Reviews", "col": "#7b3fb5"}, {"id": "dvar", "name": "Dvar Torahs", "col": "#0e8a8a"}, {"id": "jlive", "name": "Jewish Live", "col": "#2e8b57"}, {"id": "humans", "name": "Humans & Teachers", "col": "#a3173d"}], "arts": [{"id": "robotics", "t": "Warriors robotics team qualifies for state championship", "by": "Staff Reporter", "c": "news", "body": "After a record-breaking regional performance, the HA robotics squad heads to Tallahassee.", "img": "", "date": 1779753600000}], "staff": [], "cred": null}</script>
<script id="main">
const D=JSON.parse(document.getElementById('data').textContent);
const $=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,10)+Date.now().toString(36);
const fmt=d=>new Date(d).toLocaleDateString(undefined,{month:'short',day:'numeric',year:'numeric'});
let view={p:'home'},db=null,drafts=[],subs=[],admin=false;
try{admin=sessionStorage.getItem('ww_in')==='1'}catch(e){}
const PAL=["#233f9e", "#d62839", "#e0568f", "#e8872d", "#8a5a2b", "#7b3fb5", "#0e8a8a", "#2e8b57", "#a3173d"];
const catCol=id=>(D.cats.find(c=>c.id===id)||{col:'#233f9e'}).col;
const catName=id=>(D.cats.find(c=>c.id===id)||{name:'Uncategorized'}).name;
async function hash(s,salt){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(salt+s));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function img(file,max=800){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const k=Math.min(1,max/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',.7))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function publish(){
  const cl=document.documentElement.cloneNode(true);
  cl.querySelector('#app').innerHTML='';
  cl.querySelector('#data').textContent=JSON.stringify(D).replace(/</g,'\\u003c');
  cl.querySelectorAll('script').forEach(s=>{if(s.id!=='data'&&s.id!=='main')s.remove()});
  try{const a=await claude.use('artifact');if(!a)throw{message:'You need edit access to the page to publish.'};await a.publish('<!DOCTYPE html>\n'+cl.outerHTML)}
  catch(e){if(e&&e.code==='conflict')return;alert('Could not publish: '+(e.message||e))}
}
function go(v){view=v;render();scrollTo(0,0)}
function modal(html,onok){const m=document.createElement('div');m.className='mod';m.innerHTML='<div class="box">'+html+'</div>';document.body.appendChild(m);m.onclick=e=>{if(e.target===m)m.remove()};return m}
function head(){
  const today=new Date().toLocaleDateString(undefined,{month:'long',day:'numeric',year:'numeric'});
  return `<div class="top"><span>${today}</span><div class="r"><button class="g" onclick="go({p:'submit'})">+ Submit a story</button><button onclick="go({p:admin?'dash':'login'})">${admin?'Editor desk':'Editor login'}</button></div></div>
  <div class="mast"><div class="k">RASG Hebrew Academy — Warriors</div><h1 onclick="go({p:'home'})">The Warrior Word</h1><div class="st">★ ★ ★</div><div class="tg">The official student voice of RASG Hebrew Academy</div><div class="bar"><span>Vol. I, No. 1</span><span>Miami, FL</span><span>${today}</span></div></div>
  <nav>${D.cats.map(c=>`<button style="--cc:${c.col}" class="${view.c==c.id?'on':''}" onclick="go({p:'cat',c:'${c.id}'})">${esc(c.name)}</button>`).join('')}
  <button style="--cc:#f3c13a" class="${view.p=='staff'?'on':''}" onclick="go({p:'staff'})">Meet the Staff</button></nav>`}
function cardH(a){return `<div class="card" style="--cc:${catCol(a.c)}" onclick="go({p:'art',id:'${a.id}'})">${a.img?`<img src="${a.img}" alt="">`:''}<div class="x"><span class="tag">${esc(catName(a.c))}</span><h3>${esc(a.t)}</h3><p>${esc(a.body.slice(0,110))}${a.body.length>110?'…':''}</p><div class="meta">By ${esc(a.by||'Staff')} · ${fmt(a.date)}</div></div></div>`}
function arts(c){return D.arts.filter(a=>!c||a.c===c).sort((a,b)=>b.date-a.date)}
function body(){
  const v=view;
  if(v.p=='home'){const l=arts();return `<h2>Sections</h2><div class="cats">${D.cats.map(c=>`<button class="cat" style="--cc:${c.col}" onclick="go({p:'cat',c:'${c.id}'})">${esc(c.name)}<small>${arts(c.id).length} stories</small></button>`).join('')}</div><h2>Latest stories</h2>${l.length?`<div class="grid">${l.map(cardH).join('')}</div>`:'<p class="meta">No stories yet. Check back soon!</p>'}`}
  if(v.p=='cat'){const l=arts(v.c);return `<div style="--cc:${catCol(v.c)}"><h2>${esc(catName(v.c))}</h2></div>${l.length?`<div class="grid">${l.map(cardH).join('')}</div>`:'<p class="meta">Nothing here yet.</p>'}`}
  if(v.p=='art'){const a=D.arts.find(x=>x.id===v.id);if(!a)return'<p>Story not found.</p>';return `<div class="art" style="--cc:${catCol(a.c)}"><button class="btn g" onclick="go({p:'cat',c:'${a.c}'})">← ${esc(catName(a.c))}</button><br><span class="tag" style="margin-top:12px">${esc(catName(a.c))}</span><h1>${esc(a.t)}</h1><div class="meta">By ${esc(a.by||'Staff')} · ${fmt(a.date)}</div>${a.img?`<img class="hero" src="${a.img}" alt="">`:''}<div class="body">${esc(a.body)}</div>${admin?`<div class="row"><button class="btn" onclick="edit('${a.id}','pub')">Edit</button><button class="btn r" onclick="delPub('${a.id}')">Delete</button></div>`:''}</div>`}
  if(v.p=='staff')return `<h2>Meet the Staff</h2>${D.staff.length?`<div class="staff">${D.staff.map(s=>`<div class="person" style="--cc:${PAL[Math.abs(s.n.length*7)%PAL.length]}">${s.img?`<img class="av" src="${s.img}" alt="">`:`<div class="av">${esc((s.n||'?')[0])}</div>`}<h3 style="margin:4px 0">${esc(s.n)}</h3><span class="tag">${esc(s.r)}</span><p style="font-size:14px;color:var(--m)">${esc(s.bio||'')}</p></div>`).join('')}</div>`:'<p class="meta">Staff coming soon!</p>'}`;
  if(v.p=='submit')return `<h2>Submit a Story</h2><form class="f" onsubmit="sendSub(event)"><p class="meta">Got a story? Send it in! The editors will review it before it goes live.</p>${db?'':'<div class="note">Story submissions need the page to be opened while signed in to Claude. Sign in and reload to submit.</div>'}<label>Your name (shown as the byline so you get credit)</label><input type="text" id="sn" required><label>Headline</label><input type="text" id="st" required><label>Category</label><select id="sc">${D.cats.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select><label>Story</label><textarea id="sb" required></textarea><label>Photo (optional)</label><input type="file" id="si" accept="image/*"><div class="row"><button class="btn o" ${db?'':'disabled'}>Send to editors</button></div></form>`;
  if(v.p=='login'){if(!D.cred)return `<h2>Create Editor Account</h2><form class="f" onsubmit="setup(event)"><div class="note">First-time setup: the first account created becomes the editor account. Do this right away.</div><label>Email</label><input type="email" id="le" required><label>Password</label><input type="password" id="lp" required minlength="6"><div class="row"><button class="btn">Create account</button></div></form>`;
    return `<h2>Staff Login</h2><form class="f" onsubmit="login(event)"><label>Email</label><input type="email" id="le" required><label>Password</label><input type="password" id="lp" required><div class="row"><button class="btn">Log in</button></div></form>`}
  if(v.p=='dash'&&admin)return dash();
  if(v.p=='edit'&&admin)return editor();
  return '<p>Page not found.</p>'
}
function dash(){const t=view.t||'drafts';
  const tabs=[['drafts','Drafts ('+drafts.length+')'],['subs','Submissions ('+subs.length+')'],['pub','Published ('+D.arts.length+')'],['cats','Categories'],['staff','Staff'],['acct','Account']];
  let h=`<h2>Editor Desk</h2><div class="tabs">${tabs.map(([k,n])=>`<button class="btn ${t==k?'':'g'}" onclick="go({p:'dash',t:'${k}'})">${n}</button>`).join('')}</div>`;
  if(!db)h+='<div class="note">Drafts and submissions are unavailable: open this page while signed in to Claude.</div>';
  if(t=='drafts')h+=`<div class="row"><button class="btn o" onclick="edit(null,'draft')">+ New draft</button></div>`+(drafts.map(d=>`<div class="item"><div><b>${esc(d.t||'Untitled')}</b><div class="meta">Draft${d.c?' · '+esc(catName(d.c)):''}</div></div><div class="row"><button class="btn" onclick="edit('${d.id}','draft')">Edit</button><button class="btn r" onclick="delDoc('drafts','${d.id}')">Delete</button></div></div>`).join('')||'<p class="meta">No drafts.</p>');
  if(t=='subs')h+=subs.map(d=>`<div class="item"><div><b>${esc(d.t)}</b><div class="meta">From ${esc(d.by)} · ${esc(catName(d.c))}</div></div><div class="row"><button class="btn" onclick="edit('${d.id}','sub')">Review &amp; edit</button><button class="btn r" onclick="delDoc('subs','${d.id}')">Delete</button></div></div>`).join('')||'<p class="meta">No submissions.</p>';
  if(t=='pub')h+=D.arts.map(a=>`<div class="item" style="--cc:${catCol(a.c)}"><div><b>${esc(a.t)}</b><div class="meta">${esc(catName(a.c))} · ${fmt(a.date)}</div></div><div class="row"><button class="btn" onclick="edit('${a.id}','pub')">Edit</button><button class="btn r" onclick="delPub('${a.id}')">Delete</button></div></div>`).join('')||'<p class="meta">Nothing published.</p>';
  if(t=='cats')h+=`<div class="box" style="margin:0 0 12px"><div class="row"><input type="text" id="nc" placeholder="New category name" style="flex:1"><input type="color" id="ncc" value="#d62839" style="width:46px;height:42px;border:0"><button class="btn o" onclick="addCat()">Add</button></div></div>`+D.cats.map(c=>`<div class="item"><b style="color:${c.col}">${esc(c.name)}</b><div class="row"><button class="btn g" onclick="renCat('${c.id}')">Rename</button><button class="btn r" onclick="delCat('${c.id}')">Delete</button></div></div>`).join('');
  if(t=='staff')h+=`<form class="f" style="margin:0 0 12px" onsubmit="addStaff(event)"><label>Name</label><input type="text" id="pn" required><label>Job / role</label><input type="text" id="pr" required><label>About (optional)</label><input type="text" id="pb"><label>Photo (optional)</label><input type="file" id="pi" accept="image/*"><div class="row"><button class="btn o">Add staff member</button></div></form>`+D.staff.map((s,i)=>`<div class="item"><div><b>${esc(s.n)}</b><div class="meta">${esc(s.r)}</div></div><button class="btn r" onclick="delStaff(${i})">Remove</button></div>`).join('');
  if(t=='acct')h+=`<form class="f" style="margin:0" onsubmit="chgCred(event)"><p class="meta">Logged in as <b>${esc(D.cred.e)}</b>. Update these when you pass the paper to the next editor.</p><label>Current password</label><input type="password" id="cp" required><label>New email</label><input type="email" id="ce" value="${esc(D.cred.e)}" required><label>New password (leave blank to keep)</label><input type="password" id="cn"><div class="row"><button class="btn">Save</button><button type="button" class="btn g" onclick="logout()">Log out</button></div><div class="note">Note: to let someone publish changes, also give them edit access to this page in Claude (Share menu).</div></form>`;
  return h}
let cur=null;
function editor(){const x=cur;return `<h2>${x.kind=='pub'?'Edit Story':x.kind=='sub'?'Review Submission':'Draft'}</h2><form class="f" onsubmit="return false"><label>Headline</label><input type="text" id="et" value="${esc(x.t)}"><label>Byline</label><input type="text" id="eb" value="${esc(x.by)}"><label>Category</label><select id="ec"><option value="">Choose when publishing…</option>${D.cats.map(c=>`<option value="${c.id}" ${x.c==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><label>Story</label><textarea id="ex">${esc(x.body)}</textarea><label>Image</label>${x.img?`<img src="${x.img}" style="max-width:100%;border-radius:10px"><div class="row"><button type="button" class="btn r" onclick="cur.img='';sync();render()">Remove image</button></div>`:''}<input type="file" id="ei" accept="image/*" onchange="upImg()"><div class="row"><button class="btn g" onclick="saveDraft()">Save draft</button><button class="btn o" onclick="askPub()">Publish…</button><button class="btn r" onclick="go({p:'dash'})">Close</button></div></form>`}
function sync(){if(!$('#et'))return;Object.assign(cur,{t:$('#et').value,by:$('#eb').value,c:$('#ec').value,body:$('#ex').value})}
async function upImg(){sync();const f=$('#ei').files[0];if(f){cur.img=await img(f,900);render()}}
function edit(id,kind){let s=kind=='draft'?drafts.find(d=>d.id==id):kind=='sub'?subs.find(d=>d.id==id):D.arts.find(d=>d.id==id);
  cur=s?{id:s.id,kind,t:s.t||'',by:s.by||'',c:s.c||'',body:s.body||'',img:s.img||'',date:s.date}:{id:uid(),kind:'draft',t:'',by:'',c:'',body:'',img:''};
  if(kind=='sub')cur.fromSub=id;view={p:'edit'};render();scrollTo(0,0)}
async function saveDraft(){sync();if(!db)return alert('Sign in to Claude to save drafts.');
  const o={t:cur.t,by:cur.by,c:cur.c,body:cur.body,img:cur.img,date:Date.now()};
  if(cur.kind=='pub'){const a=D.arts.find(x=>x.id==cur.id);Object.assign(a,o,{date:a.date});await publish();return}
  const id=cur.kind=='sub'?cur.id:cur.id;await db.collection(cur.kind=='sub'?'subs':'drafts').doc(id).set(o);go({p:'dash',t:cur.kind=='sub'?'subs':'drafts'})}
function askPub(){sync();if(!cur.t||!cur.body)return alert('Add a headline and story first.');
  const m=modal(`<h3 style="margin-top:0">Publish story</h3><label>Which category?</label><select id="pc">${D.cats.map(c=>`<option value="${c.id}" ${cur.c==c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><div class="row"><button class="btn o" id="go">Publish</button><button class="btn g" id="no">Cancel</button></div>`);
  m.querySelector('#no').onclick=()=>m.remove();
  m.querySelector('#go').onclick=async()=>{cur.c=m.querySelector('#pc').value;m.remove();
    const o={t:cur.t,by:cur.by||'Staff',c:cur.c,body:cur.body,img:cur.img};
    const ex=D.arts.find(x=>x.id==cur.id);
    if(ex)Object.assign(ex,o);else D.arts.push({id:cur.id,date:Date.now(),...o});
    if(db){try{if(cur.kind=='draft')await db.collection('drafts').doc(cur.id).delete();if(cur.kind=='sub')await db.collection('subs').doc(cur.id).delete()}catch(e){}}
    await publish()}}
async function delDoc(col,id){if(confirm('Delete this permanently?'))await db.collection(col).doc(id).delete()}
async function delPub(id){if(confirm('Delete this published story?')){D.arts=D.arts.filter(a=>a.id!=id);await publish()}}
async function addCat(){const n=$('#nc').value.trim();if(!n)return;D.cats.push({id:uid(),name:n,col:$('#ncc').value});await publish()}
async function renCat(id){const n=prompt('New name?');if(n){D.cats.find(c=>c.id==id).name=n;await publish()}}
async function delCat(id){if(confirm('Delete this category? Its stories become uncategorized.')){D.cats=D.cats.filter(c=>c.id!=id);await publish()}}
async function addStaff(e){e.preventDefault();const f=$('#pi').files[0];D.staff.push({n:$('#pn').value,r:$('#pr').value,bio:$('#pb').value,img:f?await img(f,240):''});await publish()}
async function delStaff(i){D.staff.splice(i,1);await publish()}
async function sendSub(e){e.preventDefault();const f=$('#si').files[0];
  try{await db.collection('subs').doc(uid()).set({t:$('#st').value,by:$('#sn').value,c:$('#sc').value,body:$('#sb').value,img:f?await img(f,700):'',date:Date.now()});
  app.innerHTML=head()+'<main><div class="box"><h2>Thank you!</h2><p>Your story was sent to the editors for review.</p><button class="btn" onclick="go({p:\'home\'})">Back to home</button></div></main>'}
  catch(err){alert('Could not send: '+(err.message||err))}}
async function setup(e){e.preventDefault();const s=uid();D.cred={e:$('#le').value.toLowerCase(),s,h:await hash($('#lp').value,s)};sessionStorage.setItem('ww_in','1');admin=true;view={p:'dash'};await publish()}
async function login(e){e.preventDefault();const h=await hash($('#lp').value,D.cred.s);
  if($('#le').value.toLowerCase()==D.cred.e&&h==D.cred.h){admin=true;try{sessionStorage.setItem('ww_in','1')}catch(x){}go({p:'dash'});}else alert('Wrong email or password.')}
function logout(){admin=false;try{sessionStorage.removeItem('ww_in')}catch(e){}go({p:'home'})}
async function chgCred(e){e.preventDefault();if(await hash($('#cp').value,D.cred.s)!=D.cred.h)return alert('Current password is wrong.');
  const s=uid(),pw=$('#cn').value||$('#cp').value;D.cred={e:$('#ce').value.toLowerCase(),s,h:await hash(pw,s)};await publish()}
function render(){if(view.p=='home'&&D.cats[0])view={p:'cat',c:D.cats[0].id};const act=document.activeElement&&document.activeElement.id;app.innerHTML=head()+'<main>'+body()+'</main><footer><b>The Warrior Word</b> · RASG Hebrew Academy, Miami FL · Written &amp; edited by HA students · © 2026</footer>'}
render();
(async()=>{try{db=await Promise.race([claude.use('db'),new Promise(r=>setTimeout(()=>r(null),8000))]);if(!db)return;
  db.collection('drafts').onSnapshot(s=>{drafts=s.docs.map(d=>({id:d.id,...d.data()}));if(view.p=='dash')render()},()=>{});
  db.collection('subs').onSnapshot(s=>{subs=s.docs.map(d=>({id:d.id,...d.data()}));if(view.p=='dash')render()},()=>{});
  if(view.p=='submit')render()}catch(e){}})();
</script></body></html>
